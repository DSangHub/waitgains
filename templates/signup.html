{% extends "base.html" %}
{% block title %}Sign up - HoldPay{% endblock %}
{% block content %}
<div class="card">
  <h1>Start earning on hold time</h1>
  <p class="sub">Sign up with your email, then connect Stripe to receive your payouts.</p>

  <div id="msg" class="msg"></div>

  <form id="signup-form">
    <label for="email">Work email</label>
    <input type="email" id="email" name="email" placeholder="you@business.com" required />
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
  </form>
</div>

<script>
  const form = document.getElementById('signup-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Creating...';
    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        msg.textContent = data.error || 'Something went wrong.';
        msg.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    } catch (err) {
      msg.textContent = 'Network error. Please try again.';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>
{% endblock %}
